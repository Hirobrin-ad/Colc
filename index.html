<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Откроется в Новый год</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --sky1:#0c2152; --sky2:#1c427f; --sky3:#3b6cb3;
  --g1:#fff3b8; --g2:#ffcf4a; --g3:#c98a14;
  --glow:rgba(255,190,60,.55);
  --snow:#ffffff; --drift:#f2f7ff; --drift2:#d6e4fa;
  --tree:#0f5a45; --tree2:#0b4a38; --trunk:#5a3a22; --wire:#1a1a1a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#050c24; --sky2:#0b1a3f; --sky3:#1a3566;
    --glow:rgba(255,180,50,.5);
    --snow:#e6efff; --drift:#c9d8f0; --drift2:#a9bddf;
    --tree:#0a3d30; --tree2:#082f26;
  }
}
:root[data-theme="dark"]{
  --sky1:#050c24; --sky2:#0b1a3f; --sky3:#1a3566;
  --glow:rgba(255,180,50,.5);
  --snow:#e6efff; --drift:#c9d8f0; --drift2:#a9bddf;
  --tree:#0a3d30; --tree2:#082f26;
}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,var(--sky3) 100%);
  font-family:"Playfair Display",Georgia,"Times New Roman",serif;
}
.stars,.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.stars{z-index:0}
.stars span{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.snow{z-index:3}
.snow i{position:absolute;top:-10px;border-radius:50%;background:var(--snow);opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh)}}

.garland{position:fixed;left:0;top:env(safe-area-inset-top,0px);width:100%;height:70px;z-index:4;pointer-events:none}
.garland circle.bulb{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}

.stage{
  position:relative;z-index:2;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:0 5vw 12vh;box-sizing:border-box;text-align:center;
}
.title{
  margin:0;font-weight:800;font-style:italic;line-height:1.12;
  font-size:clamp(2.6rem,10vw,7rem);
  background:
    linear-gradient(110deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%) 150% 0/250% 100% no-repeat,
    linear-gradient(180deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 4px 18px var(--glow));
  animation:shine 6s ease-in-out infinite;
}
@keyframes shine{0%,20%{background-position:150% 0,0 0}80%,100%{background-position:-50% 0,0 0}}

.scene{position:fixed;left:0;bottom:0;width:100%;height:clamp(130px,26vh,280px);z-index:2;pointer-events:none}
.tree{position:absolute;bottom:14%}
.tree svg{display:block;width:100%;height:auto;overflow:visible}
.tree.l{left:3%;width:clamp(70px,15vw,160px)}
.tree.r{right:5%;width:clamp(55px,11vw,120px)}
.tree .lt{animation:glow 1.6s ease-in-out infinite}
.drift{position:absolute;left:0;bottom:0;width:100%;height:50%}

@media (prefers-reduced-motion: reduce){
  .title,.stars span,.snow i,.garland circle.bulb,.tree .lt{animation:none}
}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<svg class="garland" id="garland" aria-hidden="true" preserveAspectRatio="xMinYMin meet"></svg>
<div class="snow" id="snow" aria-hidden="true"></div>

<main class="stage">
  <h1 class="title">Откроется<br>в Новый год</h1>
</main>

<div class="scene" aria-hidden="true">
  <div class="tree l" id="treeL"></div>
  <div class="tree r" id="treeR"></div>
  <svg class="drift" viewBox="0 0 1200 100" preserveAspectRatio="none">
    <path fill="var(--drift2)" d="M0,55 C250,25 450,75 700,48 C900,28 1050,70 1200,45 V100 H0Z"/>
    <path fill="var(--drift)" d="M0,72 C200,50 400,88 650,68 C850,52 1000,86 1200,66 V100 H0Z"/>
  </svg>
</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg', COLORS=['#ff5a5f','#ffd23f','#4cc9f0','#ff8fd8','#7bed9f'];

  var st=document.getElementById('stars');
  for(var i=0;i<45;i++){
    var s=document.createElement('span'),d=1+Math.random()*2;
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*60)+'%';
    s.style.width=s.style.height=d+'px';
    s.style.animationDelay=(-Math.random()*3)+'s';
    s.style.animationDuration=(2+Math.random()*3)+'s';
    st.appendChild(s);
  }

  var sn=document.getElementById('snow');
  for(var j=0;j<70;j++){
    var f=document.createElement('i'),z=2+Math.random()*4;
    f.style.left=(Math.random()*100)+'%';
    f.style.width=f.style.height=z+'px';
    f.style.setProperty('--dx',((Math.random()*80)-40)+'px');
    f.style.animationDuration=(8+Math.random()*10)+'s';
    f.style.animationDelay=(-Math.random()*18)+'s';
    sn.appendChild(f);
  }

  function garland(){
    var g=document.getElementById('garland'),w=window.innerWidth,
        n=Math.max(2,Math.round(w/260)),seg=w/n,h=26,y0=6,d='M0,'+y0,k,u,c=0;
    g.setAttribute('viewBox','0 0 '+w+' 70');
    g.innerHTML='';
    for(k=0;k<n;k++){d+=' Q'+(k*seg+seg/2)+','+(y0+2*h)+' '+((k+1)*seg)+','+y0;}
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d',d);p.setAttribute('fill','none');
    p.setAttribute('stroke','var(--wire)');p.setAttribute('stroke-width','2');
    g.appendChild(p);
    var per=Math.max(5,Math.round(seg/36));
    for(k=0;k<n;k++){
      for(var m=1;m<per;m++){
        u=m/per;
        var x=k*seg+u*seg,y=y0+4*h*u*(1-u),col=COLORS[c++%COLORS.length],
            b=document.createElementNS(NS,'circle');
        b.setAttribute('class','bulb');
        b.setAttribute('cx',x);b.setAttribute('cy',y+7);b.setAttribute('r',5);
        b.setAttribute('fill',col);
        b.style.filter='drop-shadow(0 0 6px '+col+')';
        b.style.animationDelay=(-(c%5)*0.4)+'s';
        g.appendChild(b);
      }
    }
  }
  garland();
  window.addEventListener('resize',garland);

  var pts=[[50,40],[40,54],[61,70],[33,86],[67,90],[24,112],[50,102],[76,114],[44,76]];
  function tree(){
    var l='';
    pts.forEach(function(p,i){
      var col=COLORS[i%COLORS.length];
      l+='<circle class="lt" cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="'+col+'" style="filter:drop-shadow(0 0 3px '+col+');animation-delay:-'+(i*0.35)+'s"/>';
    });
    return '<svg viewBox="0 -8 100 152">'+
      '<rect x="44" y="124" width="12" height="18" fill="var(--trunk)"/>'+
      '<polygon points="50,60 8,126 92,126" fill="var(--tree2)"/>'+
      '<polygon points="50,34 16,94 84,94" fill="var(--tree)"/>'+
      '<polygon points="50,10 26,58 74,58" fill="var(--tree2)"/>'+
      l+
      '<polygon points="50,-8 53,1 62,1 55,7 58,16 50,10 42,16 45,7 38,1 47,1" fill="#ffd23f" style="filter:drop-shadow(0 0 5px #ffd23f)"/>'+
      '</svg>';
  }
  document.getElementById('treeL').innerHTML=tree();
  document.getElementById('treeR').innerHTML=tree();
})();
</script>
</body>
</html>
